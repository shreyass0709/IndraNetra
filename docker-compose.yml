version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: indranetra-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: indranetra
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: indranetra-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres-data:
